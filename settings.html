<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      body.settings-window-body {
        margin: 0;
        background: #16181c;
        color: #e8eaed;
      }
    </style>
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor Usage — 설정</title>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body class="settings-window-body">
    <div class="settings-window">
      <header class="settings-header">
        <div class="settings-header-row">
          <h1>Cursor Usage 설정</h1>
          <span id="usage-badge" class="settings-badge">—</span>
        </div>
        <p class="settings-subtitle">사용량 상태와 앱 옵션을 한곳에서 관리합니다.</p>
      </header>

      <div id="action-status" class="settings-status hidden" role="status" aria-live="polite"></div>

      <section class="settings-card">
        <h2 class="settings-card-title">사용량</h2>
        <p id="plan-detail" class="settings-detail">상태를 불러오는 중…</p>
        <ul id="usage-summary" class="settings-usage-list"></ul>
        <div class="settings-actions settings-actions--stack">
          <button id="btn-refresh" class="btn secondary wide" type="button">새로고침</button>
        </div>
      </section>

      <section class="settings-card">
        <h2 class="settings-card-title">앱</h2>
        <label class="settings-toggle">
          <input id="autostart-toggle" type="checkbox" />
          <span>Windows 시작 시 자동 실행</span>
        </label>
        <p id="autostart-hint" class="settings-hint hidden"></p>
        <label class="settings-toggle settings-toggle--spaced">
          <input id="always-on-top-toggle" type="checkbox" />
          <span>항상 다른 창 위에 표시</span>
        </label>
        <p class="settings-hint">끄면 일반 창처럼 동작해 다른 창이 위젯으로 올라올 수 있습니다.</p>
      </section>

      <footer class="settings-footer settings-footer--window">
        <button id="btn-close" class="btn primary wide" type="button">닫기</button>
      </footer>
    </div>
  </body>
</html>
